name: Generated code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generated-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-test
          POSTGRES_DB: forge_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://forge:forge-test@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: hashFiles('**/Cargo.toml') != ''
        with:
          components: llvm-tools-preview
      - name: Install Rust coverage runner
        if: hashFiles('**/Cargo.toml') != ''
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('services/*/go.mod', 'packages/*/go.mod') != ''
        with:
          go-version: stable
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: hashFiles('apps/*/pubspec.yaml') != ''
        with:
          channel: stable
      - name: Flutter desktop dependencies
        if: hashFiles('apps/*/pubspec.yaml') != ''
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Install pinned generator
        run: |
          python - <<'PYTHON'
          import json, subprocess
          recipe = json.load(open(".forge/quality.json"))
          command = ["uv", "tool", "install", recipe["generator_requirement"]]
          for requirement in recipe.get("plugin_requirements", []):
              command.extend(["--with", requirement])
          subprocess.run(command, check=True)
          PYTHON
      - name: Architecture and regeneration
        run: forge --quality architecture --project-path . --json
      - name: Install test dependencies
        run: forge --quality install --project-path . --json
      - name: Unit, integration and E2E tests
        run: forge --quality test --project-path . --json
      - name: New-code coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then
            forge --quality coverage --project-path . --base-ref "$BASE_REF" --json
          else
            forge --quality coverage --project-path . --json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-coverage
          path: .forge/coverage/
          include-hidden-files: true
          if-no-files-found: error
