_subdirectory: template
_templates_suffix: .jinja
_skip_if_exists:
  - ".env"
_exclude:
  - "node_modules"
  - "dist"
  - "coverage"
  # ``use_database=false`` (the ``http-service`` app template) drops the
  # Prisma stack and the sample CRUD entity. Matched against rendered paths;
  # renders to an empty pattern (matches nothing) when the database is on.
  - "{% if not (use_database | default(true)) %}/prisma\n/prisma.config.ts\n/src/data\n/src/lib/prisma.ts\n/src/lib/prisma-options.ts\n/src/routes/items.ts\n/src/schemas/common.schema.ts\n/src/schemas/health.schema.ts\n/src/schemas/item.schema.ts\n/src/services\n/tests/setup.ts\n/tests/integration/database.test.ts\n/tests/integration/items.test.ts\n/tests/unit/item.service.test.ts\n/tests/unit/prisma-options.test.ts\n/tests/unit/repositories.test.ts{% endif %}"

# ---------------------------------------------------------------------------
# Questions (prompted during generation)
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: "Service name in kebab-case"
  default: "my-service"
  validator: "{% if not project_name | regex_search('^[a-z][a-z0-9-]*$') %}Must be lowercase kebab-case (e.g. my-service){% endif %}"

project_description:
  type: str
  help: "One-line description"
  default: "A Node.js microservice"

server_port:
  type: int
  help: "HTTP server port"
  default: 5000

db_name:
  type: str
  help: "PostgreSQL database name"
  default: "{{ project_name | replace('-', '_') }}"

entity_plural:
  type: str
  when: false
  default: "items"

node_version:
  type: str
  help: "Node.js version"
  default: "26"
  choices:
    - "26"
    - "24"
    - "22"

include_error_envelope:
  type: bool
  help: |
    Wire ``src/middleware/error-handler.ts`` through the
    ``DefaultErrorPort`` adapter shipped by the ``error_port`` fragment
    (Pillar E.1.b runtime wiring). Default ``false`` is fail-safe: the
    generator flips it on only when the ``error_port`` fragment is in
    the active plan (see ``includes_error_envelope`` in
    ``forge/generator.py``). Emitting the port-wired branch without
    the adapter on disk would fail at runtime; the soft-import catches
    only ``ERR_MODULE_NOT_FOUND``, not init errors.
  default: false

# ---------------------------------------------------------------------------
# Derived variables (not prompted)
# ---------------------------------------------------------------------------

project_title:
  type: str
  when: false
  default: "{{ project_name | replace('-', ' ') | title }}"

# Set by the generator from the backend's app template (``http-service``
# turns it off). Only passed when false, so ``crud-service`` renders and
# records exactly what it did before this switch existed.
use_database:
  type: bool
  when: false
  default: true

# Set by the generator to the role the service serves as under
# database.rls_app_role (shared_rls). Only passed when set, so every other
# project renders and records exactly what it did before.
db_app_role:
  type: str
  when: false
  default: ""
