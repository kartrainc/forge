# Copier template configuration for Vue 3 SPA
_min_copier_version: "9.0.0"
_subdirectory: template
_exclude:
  - copier.yml
  - _tasks
  - "*.pyc"
  - __pycache__

# ─── Questions ───

project_name:
  type: str
  default: "My App"
  help: "Human-readable project name"

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  help: "npm package name (kebab-case)"

app_title:
  type: str
  default: "{{ project_name }}"
  help: "Display title for the application"

description:
  type: str
  default: "A Vue 3 SPA application"

features:
  type: str
  default: "items"
  help: "Comma-separated feature names (snake_case, e.g., 'items, orders, products')"

author_name:
  type: str
  default: "Your Name"

version:
  type: str
  default: "0.1.0"

package_manager:
  type: str
  default: "npm"
  choices:
    - npm
    - pnpm
    - yarn

include_auth:
  type: bool
  default: true
  help: "Include Keycloak authentication"

include_chat:
  type: bool
  default: true
  help: "Include AI chat panel"

include_openapi:
  type: bool
  default: true
  help: "Include OpenAPI TypeScript codegen"

include_sentry:
  type: bool
  default: false
  help: "Include @sentry/vue for error tracking"

frontend_layout:
  type: str
  when: false
  default: "sidebar"
  help: "UI app-shell layout slug (set by forge from FrontendConfig.layout)"

ui_kit:
  type: str
  when: false
  default: "shadcn"
  help: "Component library (set by forge from FrontendConfig.ui_kit; see forge.ui_kits)"

dev_server:
  type: bool
  when: false
  default: false
  help: "Also render vite.dev.config.ts for docker-compose.dev.yaml (set by forge from FrontendConfig.dev_server)"

nuxt_ui_version:
  type: str
  when: false
  default: "4.12.0"
  help: "The @nuxt/ui release of the nuxt-ui kit (set by forge from forge.ui_kits.NUXT_UI_VERSION)"

nuxt_ui_primary:
  type: str
  when: false
  default: "blue"
  help: "Tailwind palette behind Nuxt UI's primary colour (set by forge from default_color_scheme)"

security_csp:
  type: bool
  when: false
  default: false
  help: "Build for the security.csp policy: the nonce placeholder (set by forge; see forge.frontend_csp)"

consumed_services:
  type: str
  default: ""
  help: "Comma-separated backend services to codegen OpenAPI types for (e.g. 'workflow,notification'). Each gets its own subfolder under src/shared/api/generated/<service>/ to avoid type collisions."

api_base_url:
  type: str
  default: "http://localhost:5173"

api_proxy_target:
  type: str
  default: "http://localhost:5000"

env_api_base_url:
  type: str
  when: false
  default: "http://localhost:5173"

backend_features:
  type: str
  when: false
  default: "{}"

proxy_targets:
  type: str
  when: false
  default: "[]"

vite_proxy_config:
  type: str
  when: false
  default: ""

server_port:
  type: int
  default: 5173

keycloak_url:
  type: str
  default: "http://localhost:8080"
  when: "{{ include_auth }}"

keycloak_realm:
  type: str
  default: "master"
  when: "{{ include_auth }}"

keycloak_client_id:
  type: str
  default: "{{ project_slug }}"
  when: "{{ include_auth }}"

default_color_scheme:
  type: str
  default: "blue"
  help: "The first eight for shadcn; nuxt-ui also takes any Tailwind CSS palette name"
  choices:
    - blue
    - indigo
    - teal
    - green
    - deepPurple
    - red
    - amber
    - cyan
    - slate
    - gray
    - zinc
    - neutral
    - stone
    - mauve
    - olive
    - mist
    - taupe
    - orange
    - yellow
    - lime
    - emerald
    - sky
    - violet
    - purple
    - fuchsia
    - pink
    - rose

# ─── Tasks (post-generation) ───

_tasks:
  - "{{ _copier_python }} scripts/post_generate.py"
