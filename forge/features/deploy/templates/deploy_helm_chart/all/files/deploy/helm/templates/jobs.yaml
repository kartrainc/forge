{{- /* DB migration Jobs — one per backend that ships migrations. Run as a
       pre-install/pre-upgrade Helm hook so the schema is current before the
       Deployment rolls. A failed migration blocks the release (intended).

       PARALLELISM: every migrate Job uses the same hook-weight (-5), so Helm
       runs them concurrently. That is safe because each backend owns its own
       database (db_name = the backend's name), and migrations never touch
       another backend's schema. If you ever introduce a SHARED database that
       multiple backends migrate, give those Jobs distinct ascending
       hook-weights so Helm serialises them.

       The gatekeeper keygen runs as an initContainer on the in-cluster
       gatekeeper Deployment (templates/infra.yaml); the keycloak realm-sync is
       the post-install Job below. Both are gated on infra.inCluster +
       infra.gatekeeper.enabled (dev/demo — production uses an external,
       managed gatekeeper). */ -}}
{{- range $name, $w := .Values.workloads }}
{{- /* With dbAppRole and the in-cluster Postgres the Deployment's init
       containers migrate and create the role (templates/deployments.yaml). */}}
{{- if and $w.hasMigrations (not (and $w.dbAppRole $.Values.infra.inCluster)) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s-migrate" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}-migrate
  annotations:
    {{- /* ORDERING vs in-cluster Postgres: the in-cluster Postgres StatefulSet
           is a NON-hook resource created only in the main install phase, AFTER
           pre-install hooks. So when infra.inCluster=true the migrate hook must
           run POST-install (once Postgres + its per-backend databases exist) and
           wait for readiness; for an EXTERNAL DB the DB already exists, so run
           pre-install as before. */ -}}
    {{- if $.Values.infra.inCluster }}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    {{- else }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    {{- end }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}-migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if or $.Values.infra.inCluster $w.dbAppRole }}
      initContainers:
      {{- end }}
      {{- if $.Values.infra.inCluster }}
        # Block until the in-cluster Postgres accepts connections so the migrate
        # never races the StatefulSet (and its per-backend CREATE DATABASE init).
        - name: wait-for-postgres
          image: {{ $.Values.infra.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres"; sleep 2; done
      {{- end }}
      {{- if $w.dbAppRole }}
        {{- /* database.rls_app_role: migrate as the owner (the migrate Secret
               overrides the DB URL), then create the runtime role and grant
               it the migrated tables. */}}
        - name: migrate
          image: "{{ $w.image.repository }}:{{ $w.image.tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy }}
          command: {{ toJson $w.migrateCommand }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-%s-config" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
            - secretRef:
                name: {{ printf "%s-%s-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
                optional: true
            - secretRef:
                name: {{ printf "%s-%s-migrate-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
                optional: true
      containers:
        - name: db-role
          image: {{ $.Values.infra.postgres.image | default "postgres:16-alpine" | quote }}
          command: ["sh", "/scripts/db-app-role.sh"]
          env:
            - name: APP_DB_ROLE
              value: {{ $w.dbAppRole | quote }}
          envFrom:
            - secretRef:
                name: {{ printf "%s-%s-migrate-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
          volumeMounts:
            - name: db-app-role
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: db-app-role
          configMap:
            name: {{ printf "%s-db-app-role" $.Release.Name | trunc 63 | trimSuffix "-" }}
      {{- else }}
      containers:
        - name: migrate
          image: "{{ $w.image.repository }}:{{ $w.image.tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy }}
          command: {{ toJson $w.migrateCommand }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-%s-config" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
            - secretRef:
                name: {{ printf "%s-%s-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
                optional: true
      {{- end }}
{{- end }}
{{- end }}
{{- /* The database.rls_app_role script, shared by every workload's migrate Job.
       A hook like the Jobs that mount it, created before them. */ -}}
{{- $roleScript := .Files.Get "files/db-app-role.sh" }}
{{- if $roleScript }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-db-app-role" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-app-role
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  db-app-role.sh: |
{{ $roleScript | indent 4 }}
{{- end }}
{{- /* Keycloak realm-sync — in-cluster auth demo only (infra.inCluster +
       infra.gatekeeper). A post-install Job syncs the realm into the running
       Keycloak via its Admin API, reading the realm JSON bundled into the
       chart (deploy/helm/files/keycloak-realm.json) as a ConfigMap. */ -}}
{{- if and .Values.infra.inCluster .Values.infra.gatekeeper .Values.infra.gatekeeper.enabled }}
{{- if .Files.Get "files/keycloak-realm.json" }}
{{- /* The realm ConfigMap is created with the in-cluster Keycloak
       (templates/infra.yaml), before this post-install hook runs. */}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-realm-sync" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/name: realm-sync
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: realm-sync
    spec:
      restartPolicy: Never
      containers:
        - name: realm-sync
          image: "{{ .Values.infra.gatekeeper.image.repository }}:{{ .Values.infra.gatekeeper.image.tag }}"
          imagePullPolicy: {{ .Values.infra.gatekeeper.image.pullPolicy }}
          command: ["python", "scripts/realm_sync.py"]
          env:
            - name: ENV
              value: development
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak:8080/realms
            - name: KEYCLOAK_ADMIN_REALM
              value: {{ .Values.infra.keycloak.realm | quote }}
            - name: REALM_JSON_PATH
              value: /realm/keycloak-realm.json
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ printf "%s-keycloak-realm" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
