{{- /* One Deployment per backend workload. The map is generated from the
       project's deployment topology, so `forge --update` adds/removes a
       backend's Deployment automatically. */ -}}
{{- range $name, $w := .Values.workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: backend
spec:
  {{- if not $w.autoscaling.enabled }}
  replicas: {{ $w.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if and $w.dbAppRole $.Values.infra.inCluster }}
      {{- /* database.rls_app_role with the in-cluster Postgres: the database
             exists only once the release is installed, after pre-install
             hooks, and a post-install Job would run after `helm install
             --wait` waits for these pods. So each pod migrates as the owner
             and creates its role before the service starts as that role.
             Both steps are idempotent and serialize on advisory locks. */}}
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.infra.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres"; sleep 2; done
        - name: migrate
          image: "{{ $w.image.repository }}:{{ $w.image.tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy }}
          command: {{ toJson $w.migrateCommand }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-%s-config" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
            - secretRef:
                name: {{ printf "%s-%s-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
                optional: true
            - secretRef:
                name: {{ printf "%s-%s-migrate-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
        - name: db-role
          image: {{ $.Values.infra.postgres.image | quote }}
          command: ["sh", "/scripts/db-app-role.sh"]
          env:
            - name: APP_DB_ROLE
              value: {{ $w.dbAppRole | quote }}
          envFrom:
            - secretRef:
                name: {{ printf "%s-%s-migrate-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
          volumeMounts:
            - name: db-app-role
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: db-app-role
          configMap:
            name: {{ printf "%s-db-app-role" $.Release.Name | trunc 63 | trimSuffix "-" }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $w.image.repository }}:{{ $w.image.tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $w.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-%s-config" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
            - secretRef:
                name: {{ printf "%s-%s-secret" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
                optional: true
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
{{- end }}
