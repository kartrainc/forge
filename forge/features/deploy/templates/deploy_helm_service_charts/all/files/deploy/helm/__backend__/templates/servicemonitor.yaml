{{- with .Values.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "svc.fullname" $ }}
  labels:
    {{- include "svc.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" $ | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .path }}
      interval: {{ .interval }}
      {{- with .dropLabels }}
      metricRelabelings:
        {{- range . }}
        - sourceLabels: [{{ . }}]
          regex: ".+"
          action: drop
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
