{{- if .Values.ingressRoute.enabled }}
{{- range $key, $spec := .Values.ingressRoute.middlewares }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "gatekeeper.child" (dict "root" $ "suffix" $key) }}
  labels:
    {{- include "gatekeeper.labels" $ | nindent 4 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "gatekeeper.name" . }}
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    {{- range .Values.ingressRoute.routes }}
    - kind: Rule
      match: {{ required "gatekeeper: every ingressRoute.routes entry needs a match" .match | quote }}
      {{- with .priority }}
      priority: {{ . }}
      {{- end }}
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        {{- if .services }}
        {{- toYaml .services | nindent 8 }}
        {{- else }}
        - name: {{ include "gatekeeper.name" $ }}
          port: {{ $.Values.container.port }}
        {{- end }}
    {{- end }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
