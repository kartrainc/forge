{{- /* A Secret: the realm carries the confidential clients' secrets and, in development, the dev user's password. */ -}}
{{- $realm := include "keycloak.realmJson" . }}
{{- if $realm }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.child" (dict "root" . "suffix" "realm") }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-realm.json: |
    {{- $realm | nindent 4 }}
{{- end }}
