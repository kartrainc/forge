{{- if .Values.ingressRoute.enabled }}
{{- if not .Values.ingressRoute.routes }}
{{- fail (printf "%s: ingressRoute.routes is empty" .Chart.Name) }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "svc.fullname" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingressRoute.entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    {{- range .Values.ingressRoute.routes }}
    - kind: Rule
      match: {{ required "every ingressRoute route needs a match" .match | quote }}
      {{- with .priority }}
      priority: {{ . }}
      {{- end }}
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        {{- if .services }}
        {{- toYaml .services | nindent 8 }}
        {{- else }}
        - name: {{ include "svc.fullname" $ }}
          port: {{ $.Values.container.port }}
        {{- end }}
    {{- end }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
