{{- /* The roles' passwords, which the operator sets and keeps in sync (cnpg.io/reload applies a change at once).
       roleSecrets.create: false leaves these names to Secrets from elsewhere. */ -}}
{{- if .Values.roleSecrets.create }}
{{- range .Values.roles }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.roleSecret" (dict "root" $ "role" .name) }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .name | quote }}
  password: {{ required (printf "%s: roleSecrets.passwords.%s is required" $.Chart.Name .name) (index ($.Values.roleSecrets.passwords | default dict) .name) | quote }}
{{- end }}
{{- end }}
