{{- /* The password: a placeholder (CHANGEME) to override per environment, or auth.existingSecret names a Secret from
       elsewhere with the same key. */ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.child" (dict "root" . "suffix" "auth") }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required (printf "%s: auth.password is required unless auth.existingSecret is set" .Chart.Name) .Values.auth.password | quote }}
{{- end }}
