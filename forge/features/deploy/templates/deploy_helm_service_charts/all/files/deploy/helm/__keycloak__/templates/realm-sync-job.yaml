{{- /* Keycloak imports the realm into an empty database only: this hook applies the realm file's User-Profile to an
       existing realm on every install and upgrade (the compose keycloak-realm-sync one-shot). */ -}}
{{- $realm := include "keycloak.realmJson" . }}
{{- if and .Values.realm.sync.enabled $realm }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak.child" (dict "root" . "suffix" "realm-sync") }}
  labels:
    {{- include "keycloak.syncLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "keycloak.syncLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.realm.sync.podSecurityContext | nindent 8 }}
      containers:
        - name: realm-sync
          image: {{ include "keycloak.image" (dict "root" . "image" .Values.realm.sync.image "field" "realm.sync.image") | quote }}
          imagePullPolicy: {{ .Values.realm.sync.image.pullPolicy }}
          command: ["python", "scripts/realm_sync.py"]
          env:
            - name: ENV
              value: {{ .Values.mode | quote }}
            - name: KEYCLOAK_BASE_URL
              value: {{ printf "http://%s:8080/realms" (include "keycloak.name" .) | quote }}
            - name: KEYCLOAK_ADMIN_REALM
              value: {{ .Values.realm.name | quote }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.adminSecret" . }}
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.adminSecret" . }}
                  key: password
            - name: REALM_JSON_PATH
              value: /realm/keycloak-realm.json
          resources:
            {{- toYaml .Values.realm.sync.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
      volumes:
        - name: realm
          secret:
            secretName: {{ include "keycloak.child" (dict "root" . "suffix" "realm") }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
