apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gatekeeper.child" (dict "root" . "suffix" "config") }}
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
{{- with .Values.configMap.data }}
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
