{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.adminSecret" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ required "keycloak: admin.username is required" .Values.admin.username | quote }}
  password: {{ required "keycloak: admin.password is required (or admin.existingSecret)" .Values.admin.password | quote }}
{{- end }}
