{{- if .Values.secret.enabled }}
{{- $name := include "gatekeeper.child" (dict "root" . "suffix" "secret") }}
{{- $data := deepCopy (.Values.secret.stringData | default dict) }}
{{- $existing := dig "data" (dict) (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- /* The compose dev keys: public, so never a deployment's. */}}
{{- $devKeys := list "L9dXzDhHXxIbDpzmUrNSCMUgCl0rYmQ6j6lwtWXH_A4=" "UVEc0SmYvD9UcwKTlz_fMTusqFVVTNLliJ96ChlPDCI=" }}
{{- range $key := list "SESSION_FERNET_KEY" "DELEGATION_GRANT_FERNET_KEY" }}
{{- $value := index $data $key | default "" | toString }}
{{- if has $value $devKeys }}
{{- fail (printf "gatekeeper: secret.stringData.%s is a compose dev key; leave it empty to generate one" $key) }}
{{- end }}
{{- if not $value }}
{{- /* The installed release's key, unless the old chart's dev key; else a new one. */}}
{{- $value = index $existing $key | default "" | b64dec }}
{{- if has $value $devKeys }}
{{- $value = "" }}
{{- end }}
{{- end }}
{{- if not $value }}
{{- $value = randBytes 32 | replace "+" "-" | replace "/" "_" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}=$" $value) }}
{{- fail (printf "gatekeeper: secret.stringData.%s must be a Fernet key (32 bytes, URL-safe base64), or empty to generate one" $key) }}
{{- end }}
{{- $_ := set $data $key $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
