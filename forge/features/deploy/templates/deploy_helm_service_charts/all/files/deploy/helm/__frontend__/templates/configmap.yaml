{{- /* nginx config for the SPA. Under security.csp it sends configMap.securityHeaders with every response and the
       contentSecurityPolicy with index.html, whose nonce is nginx's $request_id written over the build's
       __CSP_NONCE__ placeholder; index.html is never cached, so its nonce always matches its header. */ -}}
{{- $c := .Values.configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "nginx") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
data:
  default.conf: |
{{- if $c.nginxConf }}
    {{- $c.nginxConf | nindent 4 }}
{{- else }}
    server {
        listen {{ .Values.container.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
{{- range $name, $value := $c.securityHeaders }}
        add_header {{ $name }} {{ $value | quote }} always;
{{- end }}
        location / {
            try_files $uri $uri/ /index.html;
        }
{{- with $c.contentSecurityPolicy }}
        location = /index.html {
{{- range $name, $value := $c.securityHeaders }}
            add_header {{ $name }} {{ $value | quote }} always;
{{- end }}
            add_header Content-Security-Policy {{ . | quote }} always;
            add_header Cache-Control "no-store" always;
            sub_filter_once off;
            sub_filter "__CSP_NONCE__" "$request_id";
        }
{{- end }}
    }
{{- end }}
