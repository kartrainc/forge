{{- /* The ES256 signing keys every replica mounts: the installed release's, else a new active.pem. */ -}}
{{- if not .Values.signingKeys.existingSecret }}
{{- $name := include "gatekeeper.child" (dict "root" . "suffix" "signing") }}
{{- $existing := dig "data" (dict) (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- range $key := list "active.pem" "retiring.pem" "pending.pem" }}
{{- with index $existing $key }}
{{- $_ := set $data $key . }}
{{- end }}
{{- end }}
{{- if not (hasKey $data "active.pem") }}
{{- $_ := set $data "active.pem" (genPrivateKey "ecdsa" | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
