{{- /* DB URLs and S2S credentials. forge ships ONLY placeholders (CHANGEME): override secretEnv per environment, or
       turn it off (secretEnv: {}) and provide a Secret of the same name from an ExternalSecret, a SealedSecret or a
       CSI volume; the Deployment's secretRef is optional so an external Secret takes over. A hook like the
       ConfigMap, so the migrate Job reads the DB URL on a first install. */ -}}
{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "secret") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
