{{- /* DB URLs and S2S credentials. forge ships ONLY placeholders (CHANGEME): override secretEnv per environment, or
       set secretEnv: null and provide a Secret of the same name from an ExternalSecret, a SealedSecret or a CSI
       volume; the Deployment's and the migrate Job's secretRef is then that Secret. Part of the release, like the
       ConfigMap. */ -}}
{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "secret") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
