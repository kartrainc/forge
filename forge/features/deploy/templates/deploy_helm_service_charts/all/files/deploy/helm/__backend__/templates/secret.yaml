{{- /* DB URLs and credentials, placeholders only (CHANGEME): override secret.stringData per environment, or set
       secret.enabled false and provide <release>-secret elsewhere (externalSecret, a SealedSecret, ...). */ -}}
{{- $data := include "svc.secretData" . | fromJson }}
{{- if and .Values.secret.enabled $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "secret") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
