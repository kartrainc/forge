{{- with .Values.externalSecret }}
{{- if .enabled }}
{{- if $.Values.secret.enabled }}
{{- fail (printf "gatekeeper: secret.enabled and externalSecret.enabled both write the Secret %s; disable one" (include "gatekeeper.child" (dict "root" $ "suffix" "secret"))) }}
{{- end }}
{{- if not (or .data .dataFrom) }}
{{- fail "gatekeeper: externalSecret needs data or dataFrom" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gatekeeper.child" (dict "root" $ "suffix" "secret") }}
  labels:
    {{- include "gatekeeper.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .secretStoreRef.kind }}
    name: {{ required "gatekeeper: externalSecret.secretStoreRef.name is required" .secretStoreRef.name }}
  target:
    name: {{ include "gatekeeper.child" (dict "root" $ "suffix" "secret") }}
    creationPolicy: Owner
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
