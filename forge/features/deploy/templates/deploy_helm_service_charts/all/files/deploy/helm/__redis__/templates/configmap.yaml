apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.child" (dict "root" . "suffix" "config") }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  valkey.conf: |
    # requirepass is not here: the server reads it at startup from the password Secret (templates/statefulset.yaml)
    dir /data
    appendonly yes
