{{- /* The S2S client registry: files/service_registry.yaml (compose's), else no clients. */ -}}
{{- if not .Values.serviceRegistry.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatekeeper.child" (dict "root" . "suffix" "registry") }}
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
type: Opaque
data:
  service_registry.yaml: {{ .Files.Get "files/service_registry.yaml" | default "services: []\n" | b64enc }}
{{- end }}
