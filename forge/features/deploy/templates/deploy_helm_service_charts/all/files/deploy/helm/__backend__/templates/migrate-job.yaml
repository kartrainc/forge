{{- /* The service's migration: a pre-install/pre-upgrade hook, so the schema is current before the Deployment rolls;
       a failed migration fails this release only. The database must exist first: install the platform chart before
       the services; when it runs the in-cluster Postgres, the Job waits for it (waitForPostgres). */ -}}
{{- if .Values.hasMigrations }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "migrate") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      # not the serving pods' labels: no Service, PDB or NetworkPolicy of the service selects a migration
      labels:
        app.kubernetes.io/name: {{ include "svc.child" (dict "root" . "suffix" "migrate") }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.waitForPostgres }}
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.postgresImage | quote }}
          command:
            - sh
            - -c
            - |
              if getent hosts {{ . }} >/dev/null; then
                until pg_isready -h {{ . }} -p 5432 -U postgres; do echo "waiting for postgres"; sleep 2; done
              else
                echo "{{ . }} does not resolve: no in-cluster Postgres to wait for"
              fi
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.migrateCommand }}
          envFrom:
            - configMapRef:
                name: {{ include "svc.child" (dict "root" . "suffix" "migrate-config") }}
            - secretRef:
                # the hook copy of secretEnv, or the external Secret that replaces it (secretEnv: null)
                name: {{ include "svc.child" (dict "root" . "suffix" (ternary "migrate-secret" "secret" (not (empty .Values.secretEnv)))) }}
                optional: true
{{- end }}
