{{- /* The service's migration: a pre-install/pre-upgrade hook, so the schema is current before the Deployment rolls;
       a failed migration fails this release only. The database must exist first: install the platform chart before
       the services when it runs the in-cluster Postgres, and set waitForPostgres to its host to wait for it. */ -}}
{{- if .Values.hasMigrations }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "migrate") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "svc.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.waitForPostgres }}
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.postgresImage | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ . }} -p 5432; do echo "waiting for postgres"; sleep 2; done
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.migrateCommand }}
          envFrom:
            - configMapRef:
                name: {{ include "svc.child" (dict "root" . "suffix" "config") }}
            - secretRef:
                name: {{ include "svc.child" (dict "root" . "suffix" "secret") }}
                optional: true
{{- end }}
