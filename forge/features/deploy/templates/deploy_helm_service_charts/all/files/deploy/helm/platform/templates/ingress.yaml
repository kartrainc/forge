{{- /* The Ingress to every service. Each frontend's host gets the /api/<backend> paths, with ingress.annotations, in
       <release>-<frontend>-api, and / without them in <release>-<frontend>-web, since nginx-ingress applies an
       Ingress's rewrite-target to every one of its paths. With no frontend, ingress.host gets the /api paths. */ -}}
{{- if .Values.ingress.enabled }}
{{- $hosts := list }}
{{- range .Values.ingress.frontends }}
{{- $hosts = append $hosts (dict "name" .name "host" (.host | default (ternary $.Values.ingress.host (printf "%s.%s" .name $.Values.ingress.host) .primary)) "service" .name "port" .port) }}
{{- end }}
{{- if not $hosts }}
{{- $hosts = list (dict "name" "api" "host" .Values.ingress.host) }}
{{- end }}
{{- range $hosts }}
{{- if $.Values.ingress.paths }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s-api" $.Release.Name .name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
{{- end }}
{{- if .service }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s-web" $.Release.Name .name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
{{- end }}
{{- end }}
{{- end }}
