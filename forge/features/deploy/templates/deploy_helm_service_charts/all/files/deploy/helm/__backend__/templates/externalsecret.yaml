{{- if .Values.externalSecret.enabled }}
{{- if .Values.secret.enabled }}
{{- fail (printf "%s: externalSecret.enabled needs secret.enabled false, or both would own %s" .Chart.Name (include "svc.child" (dict "root" . "suffix" "secret"))) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "svc.child" (dict "root" . "suffix" "secret") }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- include "svc.externalSecretSpec" (dict "root" . "target" "secret") | nindent 2 }}
{{- end }}
