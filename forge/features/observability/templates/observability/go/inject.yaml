# observability for Go: trace-correlated logs plus the OTLP/HTTP trace
# exporter, installed once config and logger are ready and flushed when run()
# returns; a server span per request.

- target: cmd/server/main.go
  marker: FORGE:STARTUP_INIT
  position: before
  snippet: |-
    stopTelemetry := app.StartTelemetry(ctx, cfg)
    defer stopTelemetry()

- target: internal/app/app.go
  marker: FORGE:MIDDLEWARE_REGISTRATION
  position: before
  snippet: "telemetryTracing,"
