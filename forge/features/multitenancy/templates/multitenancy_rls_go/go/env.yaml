# Tenant-resolution defaults for shared-RLS multitenancy, mirroring the
# database.tenant_* forge options. TENANT_RLS_GUC is set on the fragment impl
# spec (env_vars) so it stays in lock-step with the RLS migration policy.
TENANT_RESOLUTION: "token_claim"
TENANT_CLAIM_PATH: "tenant_id"
TENANT_HEADER_NAME: "X-Tenant-ID"
