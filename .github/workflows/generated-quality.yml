name: Generated quality
on:
  pull_request:
  push:
    branches: [main]
  # Weekly drift canary: the same gates against the live npm registry.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generated-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Rendered npm applications have no committed lockfile; their dependencies
  # are resolved in each run. Pull requests and pushes resolve them as of this
  # registry snapshot, so an upstream release cannot turn this required check
  # red without a commit. Scheduled and manual runs resolve against the live
  # registry. Advance the snapshot as the maintainer runbook describes.
  FORGE_NPM_SNAPSHOT: '2026-10-18T00:00:00Z'
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
          python-version: '3.13'
      - run: uv sync --locked --dev
      - name: New attribution policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            uv run --locked python scripts/check_attribution.py "$BASE_SHA..HEAD"
          else
            uv run --locked python scripts/check_attribution.py "HEAD^..HEAD"
          fi
      - name: Gate acceptance tests and coverage
        run: >-
          uv run --locked pytest tests/test_generated_quality.py tests/test_quality_execution.py
          tests/test_attribution_policy.py --cov-reset --cov=forge.quality
          --cov=forge.recommend --cov=forge.cli.commands.quality --cov-fail-under=80.01
          --cov-report=xml
  rendered:
    strategy:
      fail-fast: false
      matrix:
        language: [python, node, rust, go, vue, svelte]
        kit: [default]
        include:
          # The Vue template on Nuxt UI (ADR-011): the first consumer's shape,
          # auth on, chat off, two CRUD features. A kit value other than
          # `default` makes this a job of its own.
          - language: vue
            kit: nuxt-ui
            args: --ui-kit nuxt-ui --auth --features items,orders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-test
          POSTGRES_DB: forge_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://forge:forge-test@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: matrix.language == 'rust'
        with:
          components: llvm-tools-preview
      - if: matrix.language == 'rust'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27'
          cache: false
      - name: Resolve npm dependencies as of the registry snapshot
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: echo "npm_config_before=$FORGE_NPM_SNAPSHOT" >> "$GITHUB_ENV"
      - run: uv sync --locked --dev
      - name: Rendered application and shared-runtime gates
        run: uv run --locked python scripts/check_generated_quality.py --language ${{ matrix.language }} ${{ matrix.args }} --output .artifacts/generated-${{ matrix.language }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-${{ matrix.language }}-${{ matrix.kit }}-coverage
          path: .artifacts/generated-*/.forge/coverage/
          include-hidden-files: true
          if-no-files-found: error
  generated-quality:
    needs: [policy, rendered]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RENDERED_RESULT: ${{ needs.rendered.result }}
        run: test "$POLICY_RESULT" = success && test "$RENDERED_RESULT" = success
